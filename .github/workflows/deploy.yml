name: Deploy Backend API
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: drive-api-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build-and-deploy:
    needs: verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          CLAMAV_IMAGE: ${{ vars.CLAMAV_IMAGE }}
        run: |
          set -Eeuo pipefail
          missing=()
          for name in \
            JWT_SECRET MINIO_ACCESS_KEY MINIO_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL \
            DATABASE_URL DATABASE_MIGRATION_URL \
            SMTP_ADDRESS SMTP_USERNAME SMTP_PASSWORD SMTP_FROM_ADDRESS \
            CLAMAV_IMAGE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/suraj7026/drive-api:${{ github.sha }}
            ghcr.io/suraj7026/drive-api:latest

      - name: Local Deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAMAV_IMAGE: ${{ vars.CLAMAV_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          mkdir -p ~/drive/api
          cd ~/drive/api

          stopped=false
          PREVIOUS_CONTAINER=""
          rollback_deploy() {
            if [ "$stopped" != true ] || [ -z "${PREVIOUS_CONTAINER}" ]; then
              echo "Deployment failed before replacing the running API"
              return
            fi
            echo "Deployment failed; restoring the previous API container"
            docker rm -f surajdrive-backend >/dev/null 2>&1 || true
            docker rename "$PREVIOUS_CONTAINER" surajdrive-backend
            docker start surajdrive-backend || true
          }
          trap rollback_deploy ERR

          printf '%s\n' \
            "JWT_SECRET=${JWT_SECRET}" \
            "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}" \
            "MINIO_SECRET_KEY=${MINIO_SECRET_KEY}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
            "GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}" \
            "DATABASE_URL=${DATABASE_URL}" \
            "CLAMAV_IMAGE=${CLAMAV_IMAGE:?CLAMAV_IMAGE repository variable is required}" \
            "IMAGE_TAG=${IMAGE_TAG}" > .env
          chmod 600 .env

          cp "$GITHUB_WORKSPACE/deploy/docker-compose.yml" ./docker-compose.yml

          docker compose pull
          docker run --rm --network surajdrive_net \
            -e DATABASE_URL="${DATABASE_URL}" \
            ghcr.io/suraj7026/drive-api:${IMAGE_TAG} ./migrate up

          if docker inspect surajdrive-backend >/dev/null 2>&1; then
            PREVIOUS_CONTAINER="surajdrive-backend-prev-$(date +%Y%m%d%H%M%S)"
            docker rename surajdrive-backend "$PREVIOUS_CONTAINER"
            docker stop "$PREVIOUS_CONTAINER"
            stopped=true
          fi
          docker compose up -d

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4001/api/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker compose logs --tail=200
            false
          fi

          trap - ERR
          rm -f .env.rollback docker-compose.yml.rollback
