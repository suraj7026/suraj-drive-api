name: Backend CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://drive_app:ci-test-only@127.0.0.1:5432/postgres?sslmode=disable
      TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      TEST_MINIO_ACCESS_KEY: drive-ci
      TEST_MINIO_SECRET_KEY: drive-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache-dependency-path: backend/go.sum
      - name: Install native preview dependency
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Prepare isolated app-role integration database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          DATABASE_APP_PASSWORD: ci-test-only
        run: |
          go run ./cmd/migrate up
          go run ./cmd/provision-db-role
      - name: Start isolated MinIO
        run: |
          minio_binary="$RUNNER_TEMP/drive-ci-minio"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$minio_binary" \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $minio_binary" | sha256sum --check
          chmod +x "$minio_binary"
          MINIO_ROOT_USER=drive-ci MINIO_ROOT_PASSWORD=drive-ci-test-only \
            "$minio_binary" server "$RUNNER_TEMP/drive-ci-minio-data" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/drive-ci-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/drive-ci-minio.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drive-ci-minio.log"
          exit 1
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build binaries
        run: go build ./cmd/server ./cmd/migrate
      - name: Build container
        working-directory: .
        run: docker build -t drive-api:${GITHUB_SHA} ./backend
      - name: Stop isolated MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/drive-ci-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/drive-ci-minio.pid")" || true
          fi
